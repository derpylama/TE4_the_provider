        margin-right: 10px;
        cursor: pointer;
        color: white;
        font-weight: bold;
    }

    .btn-run-all { background: #0077cc; }
    .filter-success { background: #28a745; }
    .filter-warning { background: #e6a700; color:black; }
    .filter-error { background: #d93025; }
    .filter-dep { background: #ff66cc; color:black; }
    .filter-all { background: #444; }

    .section {
        background: #ddd;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .section-title {
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 10px;
    }

    .section-content { display: none; margin-top: 10px; }
    .section-content.open { display: block; }

    .test-block {
        background: #fff;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .test-block.ignored {
        opacity: 0.7;
        filter: grayscale(0.2);
    }

    .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .status {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        color: white;
        margin-bottom: 10px;
        cursor: default;
    }

    .pending { background: #888; }
    .success { background: #28a745; }
    .warning { background: #e6a700; color:black; }
    .error { background: #d93025; }
    .dependency-missing { background: #ff66cc; color:black; }
    .ignored-status { background: #777; }

    .dropdown-btn, .rerun-btn, .toggle-inputs-btn {
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 5px;
        border: none;
        font-size: 13px;
        margin-right: 5px;
    }

    .dropdown-btn { background: #0077cc; color: white; }
    .rerun-btn { background: #555; color: white; }
    .toggle-inputs-btn { background: #444; color: white; }

    .dropdown-content {
        display: none;
        background: #222;
        color: #0f0;
        padding: 10px;
        border-radius: 5px;
        margin-top: 10px;
        white-space: pre;
        overflow: auto;
        max-height: 300px;
    }
    .dropdown-content.open { display: block; }

    .inputs-panel {
        display: none;
        margin-top: 10px;
        padding: 10px;
        background: #f7f7f7;
        border-radius: 6px;
        border: 1px solid #e0e0e0;
    }
    .inputs-panel.open { display: block; }

    .input-row { margin-bottom: 8px; }
    .input-row label { display: inline-block; width: 120px; font-size: 13px; }
    .input-row input[type="text"], .input-row input[type="number"], .input-row input[type="date"], .input-row textarea {
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
        width: 60%;
        box-sizing: border-box;
    }
    .input-row textarea { height: 80px; font-family: monospace; white-space: pre-wrap; }

    .time-taken { font-size: 12px; margin-left: 10px; color: #555; }

</style>

/* ---------------------------
   Helper: safeStructuredClone
   (structuredClone may not exist everywhere)
   --------------------------- */
function safeStructuredClone(obj) {
    try {
        return structuredClone(obj);
    } catch (e) {
        return JSON.parse(JSON.stringify(obj));
    }
}

/* ---------------------------
   Helper: cleanBody (remove null/undefined/empty string)
   --------------------------- */
   function cleanBody(obj) {
    if (!obj || typeof obj !== 'object') return obj;

    const cleaned = Array.isArray(obj) ? [] : {};

    for (const k in obj) {
        const v = obj[k];

        if (v === null || v === undefined) continue;
        if (typeof v === 'string' && v.trim() === "") continue;

        if (typeof v === 'object') {

            const nested = cleanBody(v);

            // ❗ DO NOT remove arrays — arrays are valid even when empty
            if (!Array.isArray(nested)) {
                // remove empty objects only
                if (Object.keys(nested).length === 0) continue;
            }

            cleaned[k] = nested;
        } else {
            cleaned[k] = v;
        }
    }

    return cleaned;
}

/* ---------------------------
   Extract input fields (Option A)
   - Try calling body({}) to get return object and infer keys
   - Also support markers: "input" or {input:true, default:..., type:...}
   - If test.inputTypes provided, use that to set type
   --------------------------- */
   function extractInputsFromTest(test) {
    // 1. Legacy explicit bodyInputs still works
    if (test.bodyInputs && Array.isArray(test.bodyInputs)) {
        test._detectedInputs = test.bodyInputs.map(f => ({
            name: f.name,
            type: f.type || 'text',
            default: f.default ?? ''
        }));
        return;
    }

    // ------------------------
    // 2. NEW: If body is a plain object → extract keys as inputs
    // ------------------------
    if (test.body && typeof test.body === "object" && !Array.isArray(test.body)) {

        test._detectedInputs = Object.entries(test.body).map(([key, val]) => ({
            name: key,
            type: (test.inputTypes && test.inputTypes[key]) || "text",
            default: val ?? ""
        }));

        // Convert static object → function(bodyInput)
        const originalBody = test.body;
        test.body = (input) => {
            const out = {};
            for (const [k, v] of Object.entries(originalBody)) {
                out[k] = input[k] ?? v;   // override default with user input
            }
            return out;
        };

        return;
    }
    // ------------------------
    // 2.5 body is a function but has NO input.xxx → treat as static dynamic body
    if (typeof test.body === "function") {
        const keys = extractInputKeys(test.body);

        if (!keys.length) {
            const originalFn = test.body;    // ✅ capture original function

            let result;
            try {
                result = originalFn({});
            } catch {
                result = null;
            }

            if (result && typeof result === "object" && !Array.isArray(result)) {
                test._detectedInputs = Object.entries(result).map(([key, val]) => ({
                    name: key,
                    type: (test.inputTypes && test.inputTypes[key]) || "text",
                    default: val ?? ""
                }));

                // ✅ working wrapper
                test.body = (input) => {
                    const fresh = originalFn({});   // recompute using latest stored values
                    const out = {};

                    for (const [k, v] of Object.entries(fresh)) {
                        if (input[k] !== undefined && input[k] !== "") out[k] = input[k];
                        else out[k] = v;
                    }

                    return out;
                };
            }

            return;
        }
    }


    // ------------------------
    // 3. Body must be a function → detect input.xxx usage
    // ------------------------
    if (typeof test.body !== "function") {
        test._detectedInputs = [];
        return;
    }

    const keys = extractInputKeys(test.body);

    if (!keys.length) {
        test._detectedInputs = [];
        return;
    }

    test._detectedInputs = keys.map(k => ({
        name: k,
        type: (test.inputTypes && test.inputTypes[k]) || "text",
        default: ""
    }));
}


/* Run extract for all tests */
apiSections.forEach(section => section.tests.forEach(extractInputsFromTest));
/* Build global test list for refreshInputDefaults */
const allTests = apiSections.flatMap(section => section.tests);

/* ---------------------------
   Create input control markup
   - respects:
     - test._detectedInputs  (auto-detected by Option A)
     - test.inputTypes      (overrides types)
     - test.userIdTextInput (legacy single input -> mapped to username)
   - Inputs are placed inside a collapsible .inputs-panel
   --------------------------- */
function createInputsHTML(test, id) {
    const inputs = [];

    // userIdTextInput maps to 'username' unless already present
    if (test.userIdTextInput && !(test._detectedInputs || []).some(i => i.name === 'username')) {
        inputs.push({ name: 'username', type: 'text', default: '' });
    }

    if (test._detectedInputs) {
        test._detectedInputs.forEach(i => {
            const def = i.default;

            // AUTO-detect JSON: arrays & objects → textarea JSON editor
            if (typeof def === "object" && def !== null) {
                inputs.push({
                    name: i.name,
                    type: "json",     // force JSON editor
                    default: JSON.stringify(def, null, 4)
                });
            } else {
                inputs.push(i);
            }
        });
    }

    // inputTypes override
    const typeMap = test.inputTypes || {};

    if (inputs.length === 0) return "";

    let html = `<div class="inputs-panel" id="inputs-${id}">`;

    inputs.forEach(inp => {
        const name = inp.name;
        const defaultVal = inp.default ?? "";
        const override = typeMap[name];
        let type = override || inp.type || "text";

        // if override says json → force JSON textarea
        if (override === "json") type = "json";

        if (type === "json") {
            html += `
                <div class="input-row">
                    <label for="input-${id}-${name}">${name} (json):</label>
                    <textarea id="input-${id}-${name}" style="height:140px;">${escapeHtml(defaultVal)}</textarea>
                </div>`;
        } else if (type === "number") {
            html += `
                <div class="input-row">
                    <label for="input-${id}-${name}">${name} (number):</label>
                    <input type="number" id="input-${id}-${name}" value="${escapeHtml(defaultVal)}">
                </div>`;
        } else if (type === "date") {
            html += `
                <div class="input-row">
                    <label for="input-${id}-${name}">${name} (date):</label>
                    <input type="date" id="input-${id}-${name}" value="${escapeHtml(defaultVal)}">
                </div>`;
        } else if (type === "password") {
            html += `
                <div class="input-row">
                    <label for="input-${id}-${name}">${name} (password):</label>
                    <input type="password" id="input-${id}-${name}" value="${escapeHtml(defaultVal)}">
                </div>`;
        } else {
            html += `
                <div class="input-row">
                    <label for="input-${id}-${name}">${name}:</label>
                    <input type="text" id="input-${id}-${name}" value="${escapeHtml(defaultVal)}">
                </div>`;
        }
    });

    html += `</div>`;
    return html;
}

/* escape helper for safe attribute insertion */
function escapeHtml(s) {
    if (s === undefined || s === null) return '';
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

/* ---------------------------
   Build HTML for each test

function createTestHTML(test, idx, sectionId) {
    const id = `${sectionId}-${idx}`;

}

renderSections();

/* ---------------------------
   Toggle helpers
   --------------------------- */
   function toggleRequest(id) {
    const req = document.getElementById(`request-${id}`);
    const res = document.getElementById(`dropdown-${id}`);
    if (!req || !res) return;

    const opening = req.style.display !== 'block';

    // Close response if request opens
    res.style.display = "none";
    res.classList.remove("open");

    req.style.display = opening ? "block" : "none";
}

function toggleDropdown(id) {
    const req = document.getElementById(`request-${id}`);
    const res = document.getElementById(`dropdown-${id}`);
    if (!req || !res) return;

    const opening = res.style.display !== 'block';

    // Close request if response opens
    req.style.display = "none";

    res.style.display = opening ? "block" : "none";
    res.classList.toggle("open", opening);
}

function toggleSection(id) {
    document.getElementById(id).classList.toggle("open");
}
function toggleInputs(id) {
    // toggle .inputs-panel and change arrow
    const container = document.getElementById(`inputs-${id}`);
    if (!container) return;
    container.classList.toggle("open");
    // find button and toggle arrow
    const btn = document.querySelector(`#test-${id} .toggle-inputs-btn`);
    if (btn) btn.textContent = container.classList.contains("open") ? "Inputs ▲" : "Inputs ▼";
}

/* ---------------------------
   runTest (core)
   --------------------------- */
async function runTest(sectionId, idx) {
    const secIndex = parseInt(sectionId.split('-')[1], 10);
    const test = apiSections[secIndex].tests[idx];
    const id = `${sectionId}-${idx}`;
    const statusEl = document.getElementById(`status-${id}`);
    const dropdownEl = document.getElementById(`dropdown-${id}`);
    const timeEl = document.getElementById(`time-${id}`);

    statusEl.textContent = "PENDING";
    statusEl.className = "status pending";
    dropdownEl.textContent = "";
    timeEl.textContent = "";

    // skip ignored
    if (test.ignore === true) {
        statusEl.textContent = "IGNORED";
        statusEl.className = "status ignored-status";
        document.getElementById(`test-${id}`).classList.add('ignored');
        dropdownEl.textContent = "This test is ignored.";
        return;
    }

    // dependency check
    if (test.dependsOn) {
        const deps = Array.isArray(test.dependsOn) ? test.dependsOn : [test.dependsOn];
        const failingDeps = deps.filter(d => {
            const depVal = stored[d];
            return !depVal || depVal.status === 'error';
        });

        if (failingDeps.length) {
            statusEl.textContent = "DEPENDENCY MISSING";
            statusEl.className = "status dependency-missing";
            dropdownEl.textContent = "Cannot run due to failed dependency: " + failingDeps.join(", ");
            return;
        }
    }

    // Collect input values into single object 'input'
    const input = {};

    // If legacy single userIdTextInput is present and field exists in DOM, prefer that
    const userEl = document.getElementById(`input-${id}`);
    if (userEl && userEl.value.trim() !== "") input.username = userEl.value.trim();

    // From detected inputs or explicit bodyInputs/_detectedInputs
    const detected = (test._detectedInputs && Array.isArray(test._detectedInputs)) ? test._detectedInputs : [];
    // If test.bodyInputs exists as legacy, they'll have been normalized into _detectedInputs previously

    // Also consider if inputs were provided but no detection (e.g. inputTypes only) - try to infer
    // We'll find any inputs DOM elements with id pattern input-<id>-<name>
    const domInputs = document.querySelectorAll(`#test-${id} [id^="input-${id}-"]`);
    domInputs.forEach(el => {
        const full = el.id; // input-section-0-username etc
        const parts = full.split(`input-${id}-`);
        if (parts.length < 2) return;
        const name = parts[1];
        if (!name) return;
        // get type hint
        let val = null;
        if (el.tagName.toLowerCase() === 'textarea') {
            val = el.value;
        } else if (el.type === 'number') {
            val = el.value;
        } else {
            val = el.value;
        }
        if (val !== undefined && val !== null && val !== "") {
            input[name] = val; // do NOT cast to string
        } else {
            // if detected has default, use it
            const detectedObj = (detected.find(d => d.name === name) || {});
            if (detectedObj && detectedObj.default !== undefined && detectedObj.default !== '') {
                input[name] = detectedObj.default;
            }
        }
    });

    // Build bodyData by calling test.body(input) when function, else clone object and replace markers
    let bodyData = {};
    try {
        if (typeof test.body === 'function') {
            bodyData = test.body(input || {});
        } else {
            bodyData = safeStructuredClone(test.body || {});
            // replace markers like "input" or {input:true}
            for (const key in bodyData) {
                const v = bodyData[key];
                if (v === 'input' && input[key] !== undefined) bodyData[key] = input[key];
                if (v && typeof v === 'object' && v.input === true && input[key] !== undefined) bodyData[key] = input[key];
            }
        }
    } catch (e) {
        // fallback - call without inputs
        try { bodyData = (typeof test.body === 'function') ? test.body({}) : safeStructuredClone(test.body || {}); }
        catch { bodyData = {}; }
    }

    // Validate JSON fields: find any DOM json fields and ensure valid JSON, parse them into objects
    // ----------------- JSON validation & parsing -----------------
// Always attempt to parse any <textarea> inputs (they're the user-editable JSON editors).
// If valid JSON, overwrite bodyData[fieldName] with the parsed object/array.
// If invalid, collect an error.
const jsonErrors = [];
const jsonEls = document.querySelectorAll(`#test-${id} textarea[id^="input-${id}-"]`);
jsonEls.forEach(el => {
    const fieldName = el.id.replace(`input-${id}-`, '');
    const raw = el.value.trim();
    if (raw === '') return; // empty -> do nothing

    try {
        const parsed = JSON.parse(raw);
        // ensure bodyData exists
        if (!bodyData || typeof bodyData !== 'object') bodyData = {};
        // overwrite any existing value (we prefer the parsed JSON object/array)
        bodyData[fieldName] = parsed;
    } catch (err) {
        jsonErrors.push(`Field "${fieldName}" has invalid JSON: ${err.message}`);
    }
});

    if (jsonErrors.length) {
        statusEl.textContent = "ERROR";
        statusEl.className = "status error";
        dropdownEl.textContent = "JSON errors:\n" + jsonErrors.join("\n");
        if (test.storeResultAs) stored[test.storeResultAs] = null;
        return;
    }

    // At this stage, bodyData may still have string values for number/date types if user input provided string.
    // Try to coerce number/date fields if inputTypes specified
    if (test.inputTypes && typeof test.inputTypes === 'object') {
        for (const k in test.inputTypes) {
            const ttype = String(test.inputTypes[k]).toLowerCase();
            if (bodyData && bodyData[k] !== undefined) {
                if (ttype === 'number') {
                    const n = Number(bodyData[k]);
                    if (!Number.isNaN(n)) bodyData[k] = n;
                }
                // date remains string (server usually accepts ISO date)
            }
        }
    }
    if (!bodyData || typeof bodyData !== 'object') bodyData = {};

    // Clean out empty props (null/undef/"")
    bodyData = cleanBody(bodyData);

    // ---- Build headers BEFORE showing the request ----
    let finalHeaders = { "Content-Type": "application/json" };

    if (test.headers) {
        try {
            const hdr = (typeof test.headers === "function")
                ? test.headers(input)
                : test.headers;

            if (hdr && typeof hdr === "object") {
                finalHeaders = { ...finalHeaders, ...hdr };
            }
        } catch (err) {
            console.warn("Header build error:", err);
        }
    }

    // ---- Render request viewer ----
    const reqView = document.getElementById(`request-${id}`);
    if (reqView) {
        reqView.textContent = JSON.stringify({
            headers: finalHeaders,
            body: bodyData
        }, null, 4);
    }

    // ---- Perform the fetch ----
    const start = performance.now();

    try {
        let finalURL = test.url;
        let fetchOptions = {
            method: test.method || "POST",
            headers: finalHeaders
        };

        // GET → convert bodyData to query string
        if ((test.method || "POST").toUpperCase() === "GET") {
            const params = encodeQuery(bodyData);
            if (params && params.length > 0) {
                finalURL += (finalURL.includes("?") ? "&" : "?") + params;
            }
        } else {
            fetchOptions.body = JSON.stringify(bodyData);
        }

        const res = await fetch(finalURL, fetchOptions);

        const raw = await res.text();
        let parsed = null;
        let isJson = true;

        try { parsed = JSON.parse(raw); }
        catch (e) { isJson = false; }

        const duration = Math.round(performance.now() - start) + " ms";
        timeEl.textContent = `(${duration})`;

        if (!isJson) {
            statusEl.textContent = "WARNING";
            statusEl.className = "status warning";
            dropdownEl.textContent = raw;
            if (test.storeResultAs) stored[test.storeResultAs] = null;
            return;
        }

        dropdownEl.textContent = JSON.stringify(parsed, null, 4);

        if (parsed && parsed.status === 'error') {
            statusEl.textContent = "ERROR";
            statusEl.className = "status error";
        } else {
            statusEl.textContent = "SUCCESS";
            statusEl.className = "status success";
        }

        if (test.storeResultAs) {
            stored[test.storeResultAs] = parsed;
            refreshInputDefaults();
        }
    } catch (err) {
        statusEl.textContent = "ERROR";
        statusEl.className = "status error";
        dropdownEl.textContent = "Fetch error:\n" + String(err);
        if (test.storeResultAs) stored[test.storeResultAs] = null;
    }
}

/* ---------------------------
   runAll sequentially
   --------------------------- */
async function runAll() {
    for (let s = 0; s < apiSections.length; s++) {
        for (let t = 0; t < apiSections[s].tests.length; t++) {
            await runTest(`section-${s}`, t);
        }
    }
}

/* ---------------------------
   filtering
   --------------------------- */
function applyFilter(type) {
    document.querySelectorAll(".test-block").forEach(block => {
        const status = (block.querySelector(".status")?.textContent || "").toLowerCase();
        block.style.display = (type === 'all' || status.includes(type)) ? '' : 'none';
    });
}

function applyIgnoreFilter() {
    const mode = document.getElementById("ignore-filter").value;
    document.querySelectorAll(".test-block").forEach(block => {
        const isIgnored = block.classList.contains("ignored");
        if (mode === "all") block.style.display = "";
        else if (mode === "ignored") block.style.display = isIgnored ? "" : "none";
        else if (mode === "notIgnored") block.style.display = isIgnored ? "none" : "";
    });
}
function extractInputKeys(bodyFn) {
    const fnStr = bodyFn.toString();

    // Matches input.somethingAnyLength
    const regex = /input\.(\w+)/g;

    let match;
    const keys = [];

    while ((match = regex.exec(fnStr)) !== null) {
        keys.push(match[1]);
    }

    return keys;
}

function buildQueryParams(prefix, value, params) {
    if (value === null || value === undefined) return;

    if (Array.isArray(value)) {
        value.forEach((v, i) => {
            buildQueryParams(`${prefix}[${i}]`, v, params);
        });
    } else if (typeof value === "object") {
        for (const k in value) {
            buildQueryParams(`${prefix}[${k}]`, value[k], params);
        }
    } else {
        params.append(prefix, value);
    }
}

function encodeQuery(obj) {
    const params = new URLSearchParams();
    for (const k in obj) {
        buildQueryParams(k, obj[k], params);
    }
    return params.toString();
}

function refreshInputDefaults() {
    allTests.forEach(test => {
        if (!test._detectedInputs) return;
        if (typeof test.body !== "function") return;

        let newDefaults;
        try {
            newDefaults = test.body({});
        } catch (e) {
            return;
        }

        if (!newDefaults || typeof newDefaults !== "object") return;

        for (const inp of test._detectedInputs) {
            const htmlEl = document.querySelector(`#input-${test._domId}-${inp.name}`);
            if (!htmlEl) continue;

            let freshVal = newDefaults[inp.name];

            // =============== JSON TEXTAREA FIX ===============
            const isJsonEditor = htmlEl.tagName.toLowerCase() === "textarea";

            if (isJsonEditor) {
                // If user has not edited it, restore correct JSON
                if (!htmlEl.dataset.userEdited) {
                    htmlEl.value = JSON.stringify(freshVal, null, 4);
                }

                // parsed JSON back into object so defaults don't become strings
                try {
                    inp.default = JSON.parse(htmlEl.value);
                } catch {
                    // If parse fails, do NOT corrupt default
                    inp.default = freshVal; 
                }

                continue; // skip the text-input logic
            }
            // =================================================


            // Normal input refresh:
            if (!htmlEl.dataset.userEdited) {
                htmlEl.value = freshVal ?? "";
            }

            inp.default = freshVal;
        }
    });
}
